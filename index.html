<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女ノベルゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background-color: #121218;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* スマホ画面フレーム（縦持ちサイズ） */
    .phone-screen {
      width: 100%;
      max-width: 390px;
      height: 780px;
      max-height: 92vh;
      /* 上品なダーク系の背景グラデーション */
      background: linear-gradient(180deg, #2a2438 0%, #15121e 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    }

    /* 1. キャラクター表示エリア（画面中央〜下に迫る配置） */
    .character-area {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      height: 85%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1;
    }

    /* キャラクターイラストのサイズ感 */
    .character-svg {
      width: 100%;
      height: 100%;
      max-width: 360px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
      transition: all 0.3s ease;
    }

    /* 2. セリフ表示エリア（画面下に被さるすりガラス風枠） */
    .message-window {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 185px;
      background: rgba(18, 15, 25, 0.78); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* 名前表示 */
    .speaker-name {
      font-size: 0.95rem;
      color: #9dcd5a; /* パルマ風のやわらかいアクセントカラー */
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    /* セリフ文章 */
    .text-box {
      font-size: 1rem;
      line-height: 1.6;
      color: #ffffff;
      min-height: 52px;
    }

    /* 右下の送りマーク（∨） */
    .next-arrow {
      align-self: flex-end;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      animation: bounce 1.2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* 選択肢ボタン */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .choice-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 11px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      text-align: left;
      transition: all 0.2s ease;
    }

    .choice-btn:hover {
      background: rgba(157, 205, 90, 0.25);
      border-color: #9dcd5a;
    }
  </style>
</head>
<body>

<div class="phone-screen">

  <!-- イケメンキャラクターイラスト（SVG描画） -->
  <div class="character-area">
    <svg class="character-svg" viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
      <!-- 服・ジャケット -->
      <path d="M 40 380 L 75 250 C 110 240 190 240 225 250 L 260 380 Z" fill="#232733" />
      <path d="M 115 245 L 150 310 L 185 245 L 170 245 L 150 285 L 130 245 Z" fill="#e8edf0" />
      
      <!-- 首 -->
      <rect x="132" y="190" width="36" height="60" fill="#fce3d5" rx="4"/>
      <path d="M 132 215 C 150 225 150 225 168 215 L 168 250 L 132 250 Z" fill="#ebd0c0" />
      
      <!-- 輪郭（顎ライン） -->
      <polygon points="102,100 198,100 182,180 150,212 118,180" fill="#fde8dc" />
      
      <!-- 耳 -->
      <ellipse cx="98" cy="140" rx="7" ry="15" fill="#fde8dc" />
      <ellipse cx="202" cy="140" rx="7" ry="15" fill="#fde8dc" />
      
      <!-- 瞳（クールなブルーグレー） -->
      <!-- 左目 -->
      <path d="M 116 132 Q 130 124 142 133" stroke="#222" stroke-width="2.5" fill="none" />
      <ellipse cx="129" cy="140" rx="5" ry="7" fill="#3a6073" />
      <circle cx="127" cy="137" r="1.5" fill="#ffffff" />
      <!-- 右目 -->
      <path d="M 158 133 Q 170 124 184 132" stroke="#222" stroke-width="2.5" fill="none" />
      <ellipse cx="171" cy="140" rx="5" ry="7" fill="#3a6073" />
      <circle cx="169" cy="137" r="1.5" fill="#ffffff" />
      
      <!-- 眉毛（キリッとした印象） -->
      <path d="M 112 122 Q 128 116 142 123" stroke="#2b2d38" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M 158 123 Q 172 116 188 122" stroke="#2b2d38" stroke-width="2.5" fill="none" stroke-linecap="round" />
      
      <!-- 鼻・口 -->
      <path d="M 150 144 L 147 162 L 153 164" stroke="#e0beaa" stroke-width="1.8" fill="none" />
      <path d="M 140 180 Q 150 184 160 180" stroke="#d48a8a" stroke-width="2" fill="none" stroke-linecap="round" />
      
      <!-- 髪型（サラサラのダークアッシュヘア） -->
      <path d="M 85 125 C 78 60 120 30 150 30 C 180 30 222 60 215 125 C 228 80 195 40 150 40 C 105 40 72 80 85 125 Z" fill="#2b2d38" />
      <!-- 前髪の束 -->
      <path d="M 90 105 Q 122 135 132 105 Q 150 148 162 110 Q 182 140 210 100 C 200 60 100 60 90 105 Z" fill="#3b3e4f" />
      <path d="M 135 95 Q 148 128 152 95" stroke="#4f5368" stroke-width="2" fill="none" />
    </svg>
  </div>

  <!-- セリフ表示（手前に重なる） -->
  <div class="message-window">
    <div>
      <div class="speaker-name" id="speaker">ハルト</div>
      <div class="text-box" id="story-text">読み込み中...</div>
    </div>
    <div class="next-arrow" id="arrow">∨</div>
    <div class="choices-container" id="choices"></div>
  </div>

</div>

<script>
  const scenario = {
    start: {
      speaker: "ハルト",
      text: "「……急に呼んでごめんね。どうしても君に直接伝えたかったんだ。」",
      choices: [
        { text: "「どうしたの？」と優しく聞く", next: "kind" },
        { text: "「要件は手短にどうぞ」とクールに言う", next: "cool" }
      ]
    },
    kind: {
      speaker: "ハルト",
      text: "「ふふ、君のそういう優しいところ……本当にずるいよ。」",
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    },
    cool: {
      speaker: "ハルト",
      text: "「相変わらず手厳しいな。……でも、そんなところも君らしいよ。」",
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    }
  };

  function showScene(sceneKey) {
    const scene = scenario[sceneKey];
    document.getElementById("speaker").innerText = scene.speaker;
    document.getElementById("story-text").innerText = scene.text;

    const choicesContainer = document.getElementById("choices");
    const arrow = document.getElementById("arrow");
    choicesContainer.innerHTML = "";

    if (scene.choices && scene.choices.length > 0) {
      arrow.style.display = "none";
      scene.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "choice-btn";
        button.innerText = choice.text;
        button.onclick = () => showScene(choice.next);
        choicesContainer.appendChild(button);
      });
    } else {
      arrow.style.display = "block";
    }
  }

  showScene("start");
</script>

</body>
</html>
