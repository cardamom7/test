<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テスト</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background-color: #121218;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* スマホ画面フレーム */
    .phone-screen {
      width: 100%;
      max-width: 390px;
      height: 780px;
      max-height: 92vh;
      background: linear-gradient(180deg, rgba(20, 15, 30, 0.3) 0%, rgba(10, 8, 15, 0.7) 100%),
                  url('bg.png') center / cover no-repeat;
      background-color: #1a1222;
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    }

    /* キャラクター表示エリア */
    .character-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    /* バストアップ表示 */
    .character-img {
      width: 175%;
      max-width: none;
      height: auto;
      margin-top: -10px;
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.6));
      transition: opacity 0.2s ease-in-out;
    }

    /* セリフ表示エリア */
    .message-window {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 280px;
      background: rgba(15, 10, 20, 0.92); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      border-top: 1px solid rgba(244, 143, 177, 0.3);
      cursor: pointer;
    }

    .dialogue-content {
      display: flex;
      flex-direction: column;
    }

    /* ヘッダー構造 */
    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      min-height: 22px;
    }

    .speaker-name {
      font-size: 0.88rem;
      color: #f48fb1;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* エンド回収数表示 */
    .clear-count {
      font-size: 0.7rem;
      color: #ffd54f;
      background: rgba(255, 213, 79, 0.15);
      border: 1px solid rgba(255, 213, 79, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* BGMボタン */
    .bgm-btn {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    /* エンド名バッジ */
    .end-badge {
      font-size: 0.72rem;
      color: #ffd54f;
      background: rgba(255, 213, 79, 0.2);
      border: 1px solid rgba(255, 213, 79, 0.6);
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: bold;
      display: none;
    }

    /* セリフ文章 */
    .text-box {
      font-size: 0.88rem;
      line-height: 1.45;
      color: #ffffff;
      min-height: 38px;
    }

    /* タップ送りマーク */
    .next-arrow {
      align-self: flex-end;
      font-size: 0.8rem;
      color: rgba(244, 143, 177, 0.85);
      animation: bounce 1.2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* 選択肢＆エンド一覧エリア */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .choice-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(244, 143, 177, 0.35);
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      line-height: 1.3;
      text-align: left;
      transition: all 0.2s ease;
    }

    .choice-btn:hover {
      background: rgba(244, 143, 177, 0.28);
      border-color: #f48fb1;
    }

    /* エンド回収リスト（エンディング時表示） */
    .end-list-box {
      background: rgba(0, 0, 0, 0.45);
      border: 1px dashed rgba(255, 213, 79, 0.4);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 0.68rem;
      color: #bbb;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px 6px;
    }

    .end-item {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .end-item.cleared {
      color: #ffd54f;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="phone-screen">

  <!-- BGM -->
  <audio id="bgm" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
  </audio>

  <!-- キャラクター画像 -->
  <div class="character-area">
    <img id="char-img" src="character.png" class="character-img" alt="キャラクター">
  </div>

  <!-- セリフ枠 -->
  <div class="message-window" id="message-window">
    <div class="dialogue-content">
      <div class="header-box">
        <div class="speaker-name" id="speaker"></div>
        <div class="header-right">
          <div class="clear-count" id="clear-count">回収: 0/6</div>
          <button class="bgm-btn" id="bgm-toggle">🎵 ON</button>
          <div class="end-badge" id="end-badge">END</div>
        </div>
      </div>
      <div class="text-box" id="story-text">読み込み中...</div>
    </div>
    <div class="choices-container" id="choices"></div>
    <div class="next-arrow" id="arrow">∨ TAP</div>
  </div>

</div>

<script>
  // 全6種のエンド定義
  const allEnds = [
    { key: "beauty_deep", title: "END 01 / Sweet Night" },
    { key: "beauty_sweet", title: "END 02 / Eternal Promise" },
    { key: "cool_secret", title: "END 03 / Secret Time" },
    { key: "cool_cute", title: "END 04 / Special Smile" },
    { key: "smile_only", title: "END 05 / Only You" },
    { key: "smile_jealous", title: "END 06 / Dangerous Love" }
  ];

  const scenario = {
    start: {
      lines: [
        { speaker: "", image: "character.png", text: "仕事終わりの夜。エレナに誘われて、都会の喧騒を見下ろす特別なラウンジへやってきた。" },
        { speaker: "エレナ", image: "character.png", text: "「ふぅ……ようやく静かになったわね。夜風がとても気持ちいいわ。」" },
        { speaker: "エレナ", image: "character.png", text: "「あら、ふふ……お待たせ。そんなにじっと見つめられたら照れてしまうわ。」" },
        { speaker: "エレナ", image: "smile.png", text: "「でも……今日のあなた、なんだか雰囲気が違ってすごく素敵ね。」" },
        { speaker: "エレナ", image: "smile.png", text: "「二人きりで夜景を眺めるなんて、なんだかロマンチックだと思わない？」" },
        { speaker: "エレナ", image: "character.png", text: "「ねえ……今日の私、あなたの目にはどう映っているかしら？」" }
      ],
      choices: [
        { text: "「すごく美しくて見惚れていました」と伝えてみる", next: "beauty" },
        { text: "「かっこよくてドキドキします」と照れる", next: "cool" },
        { text: "「エレナさんこそ、いつも魅力的です」と微笑む", next: "smile_route" }
      ]
    },

    beauty: {
      lines: [
        { speaker: "エレナ", image: "smile.png", text: "「見惚れてくれたの？……ふふっ、ありがとう。最高の褒め言葉ね！」" },
        { speaker: "エレナ", image: "character.png", text: "「そんな真っ直ぐな瞳でおねだりされたら、大人の余裕なんて吹き飛んでしまいそうだわ。」" },
        { speaker: "エレナ", image: "smile.png", text: "「私ね、あなたのそういう素直で一生懸命なところ……すごく好きよ。」" },
        { speaker: "エレナ", image: "character.png", text: "「ねえ……今夜は、もう少しだけ私に付き合ってくれるかしら？」" }
      ],
      choices: [
        { text: "「喜んで。朝まで側にいます」と手を重ねる", next: "beauty_deep" },
        { text: "「エレナさんの気が済むまで」と微笑む", next: "beauty_sweet" }
      ]
    },
    beauty_deep: {
      endTitle: "END 01 / Sweet Night",
      lines: [
        { speaker: "エレナ", image: "smile.png", text: "「朝まで……？ ふふ、そんな大胆なお誘い、断る理由がないわ。」" },
        { speaker: "エレナ", image: "smile.png", text: "「今夜は絶対に逃がしてあげないから……覚悟しておいてね？」" }
      ],
      choices: [
        { text: "最初からやり直して他のエンドを探す", next: "start" }
      ]
    },
    beauty_sweet: {
      endTitle: "END 02 / Eternal Promise",
      lines: [
        { speaker: "エレナ", image: "smile.png", text: "「気が済むまで、ね。それなら……一生離れられなくなっちゃうかもしれないわよ？」" },
        { speaker: "エレナ", image: "character.png", text: "「ふふっ、冗談じゃないわ。本気よ？」" }
      ],
      choices: [
        { text: "最初からやり直して他のエンドを探す", next: "start" }
      ]
    },

    cool: {
      lines: [
        { speaker: "エレナ", image: "smile.png", text: "「ドキドキさせてしまったかしら？……ふふ、そんな顔も本当にかわいいわ。」" },
        { speaker: "エレナ", image: "character.png", text: "「でもね、本当は……私の方こそ、あなたといると胸が高鳴っているの。」" },
        { speaker: "エレナ", image: "character.png", text: "「かっこいい自分でいようと思っても、あなたの前だと素が出てしまいそうになるのよ。」" },
        { speaker: "エレナ", image: "smile.png", text: "「内緒よ？ 他の誰にも見せたことのない、私の特別な一面なんだから。」" }
      ],
      choices: [
        { text: "「エレナさんのこと、もっと知りたいです」", next: "cool_secret" },
        { text: "「素のエレナさんも可愛いです」", next: "cool_cute" }
      ]
    },
    cool_secret: {
      endTitle: "END 03 / Secret Time",
      lines: [
        { speaker: "エレナ", image: "smile.png", text: "「ふふ、欲張りさんね。私の秘密は一筋縄じゃ解き明かせないわよ？」" },
        { speaker: "エレナ", image: "smile.png", text: "「これから時間をかけて、ゆっくり……ひとつずつ教えてあげるわ。」" }
      ],
      choices: [
        { text: "最初からやり直して他のエンドを探す", next: "start" }
      ]
    },
    cool_cute: {
      endTitle: "END 04 / Special Smile",
      lines: [
        { speaker: "エレナ", image: "character.png", text: "「可愛い、だなんて……普段なら聞き流すけれど、あなたに言われると照れるわね。」" },
        { speaker: "エレナ", image: "smile.png", text: "「……特別に、あなたにだけは見せてあげてもいいかしら。」" }
      ],
      choices: [
        { text: "最初からやり直して他のエンドを探す", next: "start" }
      ]
    },

    smile_route: {
      lines: [
        { speaker: "エレナ", image: "smile.png", text: "「まあ、上手な返しね！ でも……あなたの言葉だから特別に嬉しいわ。」" },
        { speaker: "エレナ", image: "character.png", text: "「誰にでもそんな素敵なことを言っているわけじゃないわよね？」" },
        { speaker: "エレナ", image: "character.png", text: "「もし他の人にも言っているなら、ちょっと嫉妬してしまうかもしれないわ。」" },
        { speaker: "エレナ", image: "smile.png", text: "「ふふ、冗談よ。さあ、二人だけの特別な時間を楽しむとしましょうか。」" }
      ],
      choices: [
        { text: "「エレナさんだけにしか言っていません」と伝える", next: "smile_only" },
        { text: "「嫉妬してくれるエレナさんも素敵です」と返す", next: "smile_jealous" }
      ]
    },
    smile_only: {
      endTitle: "END 05 / Only You",
      lines: [
        { speaker: "エレナ", image: "smile.png", text: "「……！ 真顔でそんなこと言うなんて、ズルいわ。」" },
        { speaker: "エレナ", image: "smile.png", text: "「嬉しくて、胸がいっぱいになっちゃったじゃない。……本当、大好きよ。」" }
      ],
      choices: [
        { text: "最初からやり直して他のエンドを探す", next: "start" }
      ]
    },
    smile_jealous: {
      endTitle: "END 06 / Dangerous Love",
      lines: [
        { speaker: "エレナ", image: "smile.png", text: "「あら、私の嫉妬を楽しむなんて、意外と意悪ね？」" },
        { speaker: "エレナ", image: "smile.png", text: "「そんな悪い子には……もっと特別な『おしおき』が必要かしらね、ふふっ。」" }
      ],
      choices: [
        { text: "最初からやり直して他のエンドを探す", next: "start" }
      ]
    }
  };

  let currentSceneKey = "start";
  let currentLineIndex = 0;
  let bgmStarted = false;

  // クリア（回収）データ管理
  let clearedEnds = JSON.parse(localStorage.getItem("otome_cleared_ends") || "[]");

  const charImgEl = document.getElementById("char-img");
  const speakerEl = document.getElementById("speaker");
  const endBadgeEl = document.getElementById("end-badge");
  const clearCountEl = document.getElementById("clear-count");
  const storyTextEl = document.getElementById("story-text");
  const choicesContainer = document.getElementById("choices");
  const arrowEl = document.getElementById("arrow");
  const windowEl = document.getElementById("message-window");
  const bgmAudio = document.getElementById("bgm");
  const bgmToggleBtn = document.getElementById("bgm-toggle");

  bgmAudio.volume = 0.25;

  bgmToggleBtn.onclick = (e) => {
    e.stopPropagation();
    if (bgmAudio.paused) {
      bgmAudio.play();
      bgmToggleBtn.innerText = "🎵 ON";
    } else {
      bgmAudio.pause();
      bgmToggleBtn.innerText = "🔇 OFF";
    }
  };

  function updateClearCount() {
    clearCountEl.innerText = `回収: ${clearedEnds.length}/${allEnds.length}`;
  }

  function render() {
    const scene = scenario[currentSceneKey];
    const currentLine = scene.lines[currentLineIndex];

    if (charImgEl.getAttribute("src") !== currentLine.image) {
      charImgEl.src = currentLine.image;
    }

    // 地の文（名前が空の場合）は名前欄を隠す
    if (currentLine.speaker) {
      speakerEl.innerText = currentLine.speaker;
      speakerEl.style.display = "block";
    } else {
      speakerEl.innerText = "";
      speakerEl.style.display = "none";
    }

    storyTextEl.innerText = currentLine.text;

    // ★エンド到達時の処理★
    if (scene.endTitle) {
      endBadgeEl.innerText = scene.endTitle;
      endBadgeEl.style.display = "inline-block";

      // 未回収なら保存
      if (!clearedEnds.includes(currentSceneKey)) {
        clearedEnds.push(currentSceneKey);
        localStorage.setItem("otome_cleared_ends", JSON.stringify(clearedEnds));
      }
    } else {
      endBadgeEl.style.display = "none";
    }

    updateClearCount();

    const isLastLine = currentLineIndex === scene.lines.length - 1;

    if (isLastLine && scene.choices && scene.choices.length > 0) {
      arrowEl.style.display = "none";
      choicesContainer.style.display = "flex";
      choicesContainer.innerHTML = "";

      // ★エンド到達時：回収図鑑リストを表示★
      if (scene.endTitle) {
        const listContainer = document.createElement("div");
        listContainer.className = "end-list-box";

        allEnds.forEach(end => {
          const isCleared = clearedEnds.includes(end.key);
          const item = document.createElement("div");
          item.className = `end-item ${isCleared ? 'cleared' : ''}`;
          item.innerText = isCleared ? `★ ${end.title}` : `🔒 END 0${end.title.slice(4, 5)} 未回収`;
          listContainer.appendChild(item);
        });

        choicesContainer.appendChild(listContainer);
      }

      scene.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "choice-btn";
        button.innerText = choice.text;
        
        button.onclick = (e) => {
          e.stopPropagation();
          currentSceneKey = choice.next;
          currentLineIndex = 0;
          render();
        };
        choicesContainer.appendChild(button);
      });
    } else {
      arrowEl.style.display = "block";
      choicesContainer.style.display = "none";
    }
  }

  windowEl.onclick = () => {
    if (!bgmStarted) {
      bgmAudio.play().catch(() => {});
      bgmStarted = true;
    }

    const scene = scenario[currentSceneKey];
    const isLastLine = currentLineIndex === scene.lines.length - 1;

    if (!isLastLine) {
      currentLineIndex++;
      render();
    }
  };

  render();
</script>

</body>
</html>
