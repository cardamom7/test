<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女ノベルゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background-color: #0f0f14;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* スマホ縦持ちサイズのフレーム */
    .phone-screen {
      width: 100%;
      max-width: 390px;
      height: 800px;
      max-height: 92vh;
      background: linear-gradient(180deg, #2b1f31 0%, #120e17 100%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 上部：シンプルで洗練されたステータスバー */
    .header-bar {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .game-title {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #dda0dd;
      text-transform: uppercase;
    }
    .love-meter {
      font-size: 0.85rem;
      color: #ffb6c1;
      letter-spacing: 1px;
    }

    /* 中央：キャラクター表示エリア（画面のメイン） */
    .character-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* キャラクター（立ち絵の代わり） */
    .character-avatar {
      font-size: 90px;
      filter: drop-shadow(0 0 20px rgba(255, 182, 193, 0.3));
      transition: transform 0.3s ease;
    }

    /* 下部：キャラの後ろが透けるすりガラス風UI */
    .ui-bottom-area {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 20px 18px;
      /* 背景をうっすら透けさせる設定 */
      background: rgba(18, 14, 23, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .speaker-name {
      font-size: 0.95rem;
      font-weight: bold;
      color: #ffc0cb;
      letter-spacing: 1px;
    }

    .text-box {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #f0f0f0;
      min-height: 55px;
    }

    /* 選択肢ボタン */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .choice-btn {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.88rem;
      text-align: left;
      transition: all 0.2s ease;
    }
    .choice-btn:hover {
      background: rgba(255, 182, 193, 0.25);
      border-color: #ffb6c1;
      padding-left: 20px;
    }
  </style>
</head>
<body>

<div class="phone-screen">
  <!-- ヘッダー -->
  <div class="header-bar">
    <span class="game-title">Love Story</span>
    <span class="love-meter" id="love-meter">好感度: ♥♡♡♡♡</span>
  </div>

  <!-- キャラクター表示エリア（背景） -->
  <div class="character-area">
    <div class="character-avatar" id="avatar">🤵‍♂️</div>
  </div>

  <!-- 下部の透けるメッセージ＆選択肢 -->
  <div class="ui-bottom-area">
    <div class="speaker-name" id="speaker">イケメン</div>
    <div class="text-box" id="story-text">読み込み中...</div>
    <div class="choices-container" id="choices"></div>
  </div>
</div>

<script>
  let lovePoints = 1;

  // テスト用シナリオ（ここを自由に書き換えてゲームを作ります！）
  const scenario = {
    start: {
      speaker: "皇 凛太郎（すめらぎ りんたろう）",
      avatar: "🤵‍♂️",
      text: "「待たせてごめん。……ふふ、そんなに見つめられると照れるな。」",
      choices: [
        { text: "「全然待ってないよ」と微笑む", next: "smile", love: 1 },
        { text: "「遅刻したからジュースおごって」", next: "juice", love: 0 },
        { text: "黙って鼻毛カッターを差し出す", next: "surreal", love: -1 }
      ]
    },
    smile: {
      speaker: "皇 凛太郎",
      avatar: "🥰",
      text: "「君はいつも優しいね。……よし、今日は君の行きたい場所へ行こう。」",
      choices: [
        { text: "最初からやり直す", next: "start", reset: true }
      ]
    },
    juice: {
      speaker: "皇 凛太郎",
      avatar: "😊",
      text: "「あはは、現金だなあ。いいよ、あそこの自動販売機で好きなのを選んで？」",
      choices: [
        { text: "最初からやり直す", next: "start", reset: true }
      ]
    },
    surreal: {
      speaker: "皇 凛太郎",
      avatar: "😳",
      text: "「えっ……？出てる……！？僕、鼻毛出てた……！？（激しいショックを受けた）」",
      choices: [
        { text: "最初からやり直す", next: "start", reset: true }
      ]
    }
  };

  function updateLoveMeter() {
    let hearts = "";
    const count = Math.max(0, Math.min(5, lovePoints));
    for (let i = 0; i < 5; i++) {
      hearts += i < count ? "♥" : "♡";
    }
    document.getElementById("love-meter").innerText = `好感度: ${hearts}`;
  }

  function showScene(sceneKey) {
    const scene = scenario[sceneKey];
    document.getElementById("speaker").innerText = scene.speaker;
    document.getElementById("story-text").innerText = scene.text;
    document.getElementById("avatar").innerText = scene.avatar || "🤵‍♂️";

    const choicesContainer = document.getElementById("choices");
    choicesContainer.innerHTML = "";

    scene.choices.forEach(choice => {
      const button = document.createElement("button");
      button.className = "choice-btn";
      button.innerText = choice.text;
      button.onclick = () => {
        if (choice.reset) {
          lovePoints = 1;
        } else if (choice.love !== undefined) {
          lovePoints += choice.love;
        }
        updateLoveMeter();
        showScene(choice.next);
      };
      choicesContainer.appendChild(button);
    });
  }

  updateLoveMeter();
  showScene("start");
</script>

</body>
</html>
