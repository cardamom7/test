<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女ノベルゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background-color: #1a1a24;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* スマホ画面フレーム（縦持ちサイズ） */
    .phone-screen {
      width: 100%;
      max-width: 390px;
      height: 780px;
      max-height: 92vh;
      /* ↓ 背景の色やグラデーションはここでお好きな色に変えられます */
      background: linear-gradient(180deg, #fce4ec 0%, #f8bbd0 100%);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 1. キャラクター表示エリア（画面全体に大きく配置） */
    .character-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end; /* キャラクターを下に寄せてバストアップ表示 */
      padding-bottom: 120px; /* セリフ枠と自然に被る位置に調整 */
      z-index: 1;
    }

    /* キャラクターのサイズ感（ドアップ表示） */
    .character-image {
      /* イラスト画像を使う場合はこちらを有効化 */
      max-width: 120%;
      height: 75%;
      object-fit: contain;
    }

    .character-avatar {
      /* アイコン・絵文字テスト用の超巨大表示 */
      font-size: 160px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.15));
      transition: transform 0.2s ease;
    }

    /* 2. セリフ表示エリア（画面下に被さる半透明枠） */
    .message-window {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      min-height: 180px;
      /* ↓ セリフ枠の背景色・透け感（黒系でもピンク系でも変更自由） */
      background: rgba(20, 20, 30, 0.75); 
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 18px 20px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10; /* キャラクターの上に重ねる */
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* 名前表示 */
    .speaker-name {
      font-size: 0.95rem;
      color: #ff80ab; /* 名前の文字色 */
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    /* セリフ文章 */
    .text-box {
      font-size: 1rem;
      line-height: 1.6;
      color: #ffffff; /* セリフの文字色 */
      min-height: 50px;
    }

    /* 右下の送りマーク（∨） */
    .next-arrow {
      align-self: flex-end;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      animation: bounce 1.2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* 選択肢ボタン */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 10px;
    }

    .choice-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 11px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      text-align: left;
      transition: all 0.2s ease;
    }

    .choice-btn:hover {
      background: rgba(255, 128, 171, 0.4);
      border-color: #ff80ab;
    }
  </style>
</head>
<body>

<div class="phone-screen">

  <!-- キャラクター表示（後ろに重なる） -->
  <div class="character-area">
    <div class="character-avatar" id="avatar">🤵‍♂️</div>
  </div>

  <!-- セリフ表示（手前に重なる） -->
  <div class="message-window">
    <div>
      <div class="speaker-name" id="speaker">キャラ名</div>
      <div class="text-box" id="story-text">読み込み中...</div>
    </div>
    <div class="next-arrow" id="arrow">∨</div>
    <div class="choices-container" id="choices"></div>
  </div>

</div>

<script>
  // シナリオデータの構造
  const scenario = {
    start: {
      speaker: "神代 蓮",
      avatar: "🤵‍♂️",
      text: "「こうして近くで君の顔を見ていると……なんだか不思議な気分になるよ。」",
      choices: [
        { text: "「私もだよ」と見つめ返す", next: "look" },
        { text: "「顔が近すぎるよ！」と照れる", next: "shy" }
      ]
    },
    look: {
      speaker: "神代 蓮",
      avatar: "🥰",
      text: "「ふふ、そんなに真っ直ぐ見つめられたら、僕の方がドキドキしちゃうな。」",
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    },
    shy: {
      speaker: "神代 蓮",
      avatar: "😊",
      text: "「ごめんごめん、あまりに君が可愛いから、つい引き寄せられちゃって。」",
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    }
  };

  function showScene(sceneKey) {
    const scene = scenario[sceneKey];
    document.getElementById("speaker").innerText = scene.speaker;
    document.getElementById("story-text").innerText = scene.text;
    document.getElementById("avatar").innerText = scene.avatar || "🤵‍♂️";

    const choicesContainer = document.getElementById("choices");
    const arrow = document.getElementById("arrow");
    choicesContainer.innerHTML = "";

    if (scene.choices && scene.choices.length > 0) {
      arrow.style.display = "none";
      scene.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "choice-btn";
        button.innerText = choice.text;
        button.onclick = () => showScene(choice.next);
        choicesContainer.appendChild(button);
      });
    } else {
      arrow.style.display = "block";
    }
  }

  showScene("start");
</script>

</body>
</html>
