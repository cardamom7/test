<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>テストページ</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 50px 20px;
      background-color: #f0f4f8;
      color: #333;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background-color: #45a049; }
  </style>
</head>
<body>

  <div class="card">
    <h1>✨ お試しテストページ ✨</h1>
    <p>GitHub PagesでWebページを作るテストです！</p>
    <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
    <p id="result" style="font-size: 18px; font-weight: bold; min-height: 27px;">ボタンを押してみてね！</p>
    <button onclick="drawOmikuji()">運勢を占う</button>
  </div>

  <script>
    const fortunes = [
      "🎉 大吉：今日は最高の1日になりそう！",
      "🌟 吉：新しいことに挑戦するとラッキー！",
      "😊 中吉：おいしいものを食べると運気アップ！",
      "🍀 小吉：のんびり過ごすのが吉。"
    ];

    function drawOmikuji() {
      const randomIndex = Math.floor(Math.random() * fortunes.length);
      document.getElementById("result").innerText = fortunes[randomIndex];
    }
  </script>

</body>
</html>
