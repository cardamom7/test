<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シュール乙女ゲーム</title>
  <style>
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background: linear-gradient(135deg, #ffe6e9 0%, #ffd1dc 100%);
      color: #4a4a4a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .game-container {
      width: 100%;
      max-width: 550px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(220, 100, 130, 0.2);
      border: 3px solid #ffb6c1;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #fff0f5;
      padding: 8px 16px;
      border-radius: 20px;
      margin-bottom: 15px;
      font-size: 0.9rem;
      color: #d87093;
      font-weight: bold;
    }
    .speaker-tag {
      font-weight: bold;
      color: #d87093;
      margin-bottom: 8px;
      font-size: 1.1rem;
      border-left: 4px solid #ff69b4;
      padding-left: 8px;
    }
    .text-box {
      background-color: #ffffff;
      padding: 18px;
      border-radius: 12px;
      min-height: 90px;
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 20px;
      border: 2px solid #ffe4e1;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .choice-btn {
      background-color: #fff0f5;
      color: #c71585;
      border: 2px solid #ffb6c1;
      padding: 12px 18px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: bold;
      text-align: center;
      transition: all 0.2s;
    }
    .choice-btn:hover {
      background-color: #ff69b4;
      color: #ffffff;
      border-color: #ff69b4;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="status-bar">
    <span>🌸 攻略対象：神代 蓮（かみしろ れん）</span>
    <span id="love-meter">好感度: ♡♡♡♡♡</span>
  </div>
  <div class="speaker-tag" id="speaker">???</div>
  <div class="text-box" id="story-text">読み込み中...</div>
  <div class="choices-container" id="choices"></div>
</div>

<script>
  let lovePoints = 0; // 好感度カウンター

  const scenario = {
    start: {
      speaker: "ナレーション",
      text: "曲がり角で勢いよく何かにぶつかってしまった！食パン……ではなく、なぜか「長ネギ」を口に加えた超絶イケメンが倒れている。",
      choices: [
        { text: "「大丈夫ですか！？」と手を差し伸べる", next: "hand" },
        { text: "ネギの産地を尋ねる", next: "negi" },
        { text: "自分もポケットからアスパラを出す", next: "asparagus" }
      ]
    },
    hand: {
      speaker: "神代 蓮",
      text: "「フッ……触るな。俺の美しさに触れると、君の細胞が驚いて爆発するぞ。」（※好感度が下がった）",
      choices: [
        { text: "「すみませんでした」と謝る", next: "sorry", love: -1 },
        { text: "「じゃあ爆発してみせます！」と挑む", next: "challenge", love: 1 }
      ]
    },
    negi: {
      speaker: "神代 蓮",
      text: "「ふっ、目が高いね。これは深谷産だ。君、ネギの味がわかる女だな……気に入った。」（※好感度アップ！）",
      choices: [
        { text: "微笑んで「ネギはお薬になりますしね」と言う", next: "next_event", love: 2 },
        { text: "「実は私、タマネギ派なんです」と伝える", next: "onion", love: -2 }
      ]
    },
    asparagus: {
      speaker: "神代 蓮",
      text: "「……対抗意識か？嫌いじゃないよ、その威圧感。」（※好感度アップ！）",
      choices: [
        { text: "そのまま野菜バトルを始める", next: "battle_end", love: 1 }
      ]
    },

    // 展開の例
    sorry: {
      speaker: "神代 蓮",
      text: "「素直な子は好きだよ。でもネギはあげないからね。」【普通END】",
      choices: [{ text: "最初からやり直す", next: "start", reset: true }]
    },
    challenge: {
      speaker: "神代 蓮",
      text: "「面白い……！君、明日から俺の専属ネギ係になりなよ！」【ネギ係END】",
      choices: [{ text: "最初からやり直す", next: "start", reset: true }]
    },
    next_event: {
      speaker: "神代 蓮",
      text: "「ふふ、君といると退屈しないな。今度、僕の自慢のファミレスに連れて行ってあげるよ。」【グッドハッピーEND】",
      choices: [{ text: "最初からやり直す", next: "start", reset: true }]
    },
    onion: {
      speaker: "ナレーション",
      text: "激しい宗教的対立により、2人の恋は儚く散った……。【破局END】",
      choices: [{ text: "最初からやり直す", next: "start", reset: true }]
    },
    battle_end: {
      speaker: "ナレーション",
      text: "2人は夕日を浴びながら野菜を振り回し、最高のライバルとなった。【青春END】",
      choices: [{ text: "最初からやり直す", next: "start", reset: true }]
    }
  };

  function updateLoveMeter() {
    let hearts = "";
    const count = Math.max(0, Math.min(5, 3 + lovePoints)); // 0〜5の範囲
    for (let i = 0; i < 5; i++) {
      hearts += i < count ? "♥" : "♡";
    }
    document.getElementById("love-meter").innerText = `好感度: ${hearts}`;
  }

  function showScene(sceneKey) {
    const scene = scenario[sceneKey];
    document.getElementById("speaker").innerText = scene.speaker;
    document.getElementById("story-text").innerText = scene.text;

    const choicesContainer = document.getElementById("choices");
    choicesContainer.innerHTML = "";

    scene.choices.forEach(choice => {
      const button = document.createElement("button");
      button.className = "choice-btn";
      button.innerText = choice.text;
      button.onclick = () => {
        if (choice.reset) {
          lovePoints = 0;
        } else if (choice.love) {
          lovePoints += choice.love;
        }
        updateLoveMeter();
        showScene(choice.next);
      };
      choicesContainer.appendChild(button);
    });
  }

  updateLoveMeter();
  showScene("start");
</script>

</body>
</html>
