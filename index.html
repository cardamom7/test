<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女ノベルゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background-color: #121218;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* スマホ画面フレーム */
    .phone-screen {
      width: 100%;
      max-width: 390px;
      height: 780px;
      max-height: 92vh;
      /* 上品でラグジュアリーなダークパープル背景 */
      background: linear-gradient(180deg, #2b1b2d 0%, #120c18 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    }

    /* 1. キャラクター表示エリア（枠外をカット） */
    .character-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      z-index: 1;
      pointer-events: none;
      overflow: hidden; /* はみ出た足をカットしてバストアップ化 */
    }

    /* 全身画像をパルマ風ドアップ（バストアップ）に拡大表示する設定 */
    .character-img {
      width: 175%; /* 大きく拡大してドアップ表示 */
      max-width: none;
      height: auto;
      margin-top: -10px; /* 頭頂部の位置調整 */
      filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.5));
      transition: all 0.3s ease;
    }

    /* 2. セリフ表示エリア（1画面完結・スクロール完全なし） */
    .message-window {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 260px; /* 固定サイズ */
      background: rgba(18, 12, 22, 0.88); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      border-top: 1px solid rgba(235, 130, 180, 0.25);
      cursor: pointer;
    }

    .dialogue-content {
      display: flex;
      flex-direction: column;
    }

    /* 名前表示 */
    .speaker-name {
      font-size: 0.88rem;
      color: #f48fb1; /* キャラクターに合わせた綺麗なピンク */
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    /* セリフ文章 */
    .text-box {
      font-size: 0.9rem;
      line-height: 1.45;
      color: #ffffff;
      min-height: 42px;
    }

    /* 右下のタップ送りマーク */
    .next-arrow {
      align-self: flex-end;
      font-size: 0.8rem;
      color: rgba(244, 143, 177, 0.8);
      animation: bounce 1.2s infinite ease-in-out;
      margin-top: 2px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* 選択肢ボタンエリア */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .choice-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(244, 143, 177, 0.3);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      line-height: 1.3;
      text-align: left;
      transition: all 0.2s ease;
    }

    .choice-btn:hover {
      background: rgba(244, 143, 177, 0.25);
      border-color: #f48fb1;
    }
  </style>
</head>
<body>

<div class="phone-screen">

  <!-- キャラクター画像（自動でドアップ表示されます） -->
  <div class="character-area">
    <img src="character.png" class="character-img" alt="キャラクター">
  </div>

  <!-- セリフ表示（枠タップで進行） -->
  <div class="message-window" id="message-window">
    <div class="dialogue-content">
      <div class="speaker-name" id="speaker">名前</div>
      <div class="text-box" id="story-text">読み込み中...</div>
    </div>
    <div class="choices-container" id="choices"></div>
    <div class="next-arrow" id="arrow">∨ TAP</div>
  </div>

</div>

<script>
  const scenario = {
    start: {
      lines: [
        { speaker: "エレナ", text: "「あら、ふふ……お待たせ。今日のあなた、なんだか雰囲気が違って素敵ね。」" },
        { speaker: "エレナ", text: "「そんなにじっと見つめられたら、私でも少し照れてしまうわ。」" },
        { speaker: "エレナ", text: "「ねえ……今日の私、あなたの目にはどう映っているかしら？」" }
      ],
      choices: [
        { text: "「すごく美しくて見惚れていました」と正直に伝える", next: "beauty" },
        { text: "「かっこよくてドキドキします」と照れる", next: "cool" },
        { text: "「エレナさんこそ、いつも素敵です」と微笑む", next: "smile" }
      ]
    },
    beauty: {
      lines: [
        { speaker: "エレナ", text: "「見惚れてくれたの？……ふふ、最高の褒め言葉ね。」" },
        { speaker: "エレナ", text: "「今夜はもう少しだけ、あなたの近くにいてもいいかしら？」" }
      ],
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    },
    cool: {
      lines: [
        { speaker: "エレナ", text: "「ドキドキさせてしまったかしら？……かわいい人。」" },
        { speaker: "エレナ", text: "「でもね、本当は私のほうこそ緊張しているのよ？」" }
      ],
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    },
    smile: {
      lines: [
        { speaker: "エレナ", text: "「まあ、上手な返しね。でもとっても嬉しいわ。」" },
        { speaker: "エレナ", text: "「ふふ、二人だけの特別な時間にしましょうか。」" }
      ],
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    }
  };

  let currentSceneKey = "start";
  let currentLineIndex = 0;

  const speakerEl = document.getElementById("speaker");
  const storyTextEl = document.getElementById("story-text");
  const choicesContainer = document.getElementById("choices");
  const arrowEl = document.getElementById("arrow");
  const windowEl = document.getElementById("message-window");

  function render() {
    const scene = scenario[currentSceneKey];
    const currentLine = scene.lines[currentLineIndex];

    speakerEl.innerText = currentLine.speaker;
    storyTextEl.innerText = currentLine.text;

    const isLastLine = currentLineIndex === scene.lines.length - 1;

    if (isLastLine && scene.choices && scene.choices.length > 0) {
      arrowEl.style.display = "none";
      choicesContainer.style.display = "flex";
      choicesContainer.innerHTML = "";

      scene.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "choice-btn";
        button.innerText = choice.text;
        
        button.onclick = (e) => {
          e.stopPropagation();
          currentSceneKey = choice.next;
          currentLineIndex = 0;
          render();
        };
        choicesContainer.appendChild(button);
      });
    } else {
      arrowEl.style.display = "block";
      choicesContainer.style.display = "none";
    }
  }

  windowEl.onclick = () => {
    const scene = scenario[currentSceneKey];
    const isLastLine = currentLineIndex === scene.lines.length - 1;

    if (!isLastLine) {
      currentLineIndex++;
      render();
    }
  };

  render();
</script>

</body>
</html>
