<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>乙女ノベルゲーム</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Hiragino Sans", "Meiryo", sans-serif;
      background-color: #121218;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none; /* スマホ連打時の文字選択を防止 */
      -webkit-user-select: none;
    }

    /* スマホ画面フレーム（縦持ちサイズ） */
    .phone-screen {
      width: 100%;
      max-width: 390px;
      height: 780px;
      max-height: 92vh;
      background: linear-gradient(180deg, #2a2438 0%, #15121e 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
    }

    /* 1. キャラクター表示エリア */
    .character-area {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      height: 85%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 1;
      pointer-events: none; /* キャラクター部分のタップを透過 */
    }

    .character-svg {
      width: 100%;
      height: 100%;
      max-width: 360px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
      transition: all 0.3s ease;
    }

    /* 2. セリフ表示エリア（★高さを完全固定★） */
    .message-window {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 240px; /* ★ここでサイズを固定★ */
      background: rgba(18, 15, 25, 0.85); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 18px 20px 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer; /* スマホでタップできることを示す */
    }

    /* 上部テキスト情報 */
    .dialogue-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 名前表示 */
    .speaker-name {
      font-size: 0.95rem;
      color: #9dcd5a;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    /* セリフ文章 */
    .text-box {
      font-size: 0.98rem;
      line-height: 1.6;
      color: #ffffff;
      flex: 1;
      overflow-y: auto;
    }

    /* 右下のタップ送りマーク（∨） */
    .next-arrow {
      align-self: flex-end;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      animation: bounce 1.2s infinite ease-in-out;
      margin-top: 4px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* 選択肢ボタンエリア */
    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      max-height: 120px;
      overflow-y: auto; /* 選択肢が多くても固定枠内に収める */
    }

    .choice-btn {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 9px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      text-align: left;
      transition: all 0.2s ease;
    }

    .choice-btn:hover {
      background: rgba(157, 205, 90, 0.25);
      border-color: #9dcd5a;
    }
  </style>
</head>
<body>

<div class="phone-screen">

  <!-- イケメンキャラクターイラスト -->
  <div class="character-area">
    <svg class="character-svg" viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
      <path d="M 40 380 L 75 250 C 110 240 190 240 225 250 L 260 380 Z" fill="#232733" />
      <path d="M 115 245 L 150 310 L 185 245 L 170 245 L 150 285 L 130 245 Z" fill="#e8edf0" />
      <rect x="132" y="190" width="36" height="60" fill="#fce3d5" rx="4"/>
      <path d="M 132 215 C 150 225 150 225 168 215 L 168 250 L 132 250 Z" fill="#ebd0c0" />
      <polygon points="102,100 198,100 182,180 150,212 118,180" fill="#fde8dc" />
      <ellipse cx="98" cy="140" rx="7" ry="15" fill="#fde8dc" />
      <ellipse cx="202" cy="140" rx="7" ry="15" fill="#fde8dc" />
      <path d="M 116 132 Q 130 124 142 133" stroke="#222" stroke-width="2.5" fill="none" />
      <ellipse cx="129" cy="140" rx="5" ry="7" fill="#3a6073" />
      <circle cx="127" cy="137" r="1.5" fill="#ffffff" />
      <path d="M 158 133 Q 170 124 184 132" stroke="#222" stroke-width="2.5" fill="none" />
      <ellipse cx="171" cy="140" rx="5" ry="7" fill="#3a6073" />
      <circle cx="169" cy="137" r="1.5" fill="#ffffff" />
      <path d="M 112 122 Q 128 116 142 123" stroke="#2b2d38" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M 158 123 Q 172 116 188 122" stroke="#2b2d38" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M 150 144 L 147 162 L 153 164" stroke="#e0beaa" stroke-width="1.8" fill="none" />
      <path d="M 140 180 Q 150 184 160 180" stroke="#d48a8a" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M 85 125 C 78 60 120 30 150 30 C 180 30 222 60 215 125 C 228 80 195 40 150 40 C 105 40 72 80 85 125 Z" fill="#2b2d38" />
      <path d="M 90 105 Q 122 135 132 105 Q 150 148 162 110 Q 182 140 210 100 C 200 60 100 60 90 105 Z" fill="#3b3e4f" />
      <path d="M 135 95 Q 148 128 152 95" stroke="#4f5368" stroke-width="2" fill="none" />
    </svg>
  </div>

  <!-- セリフ表示（枠どこでもタップで次へ） -->
  <div class="message-window" id="message-window">
    <div class="dialogue-content">
      <div class="speaker-name" id="speaker">名前</div>
      <div class="text-box" id="story-text">読み込み中...</div>
    </div>
    <div class="choices-container" id="choices"></div>
    <div class="next-arrow" id="arrow">∨ TAP</div>
  </div>

</div>

<script>
  // ★複数のセリフが連続するシナリオ構造★
  const scenario = {
    start: {
      lines: [
        { speaker: "ハルト", text: "「……あ、来てくれたんだね。待たせてごめん。」" },
        { speaker: "ハルト", text: "「今日さ、どうしても君に直接聞いておきたいことがあって……。」" },
        { speaker: "ハルト", text: "「……そんな真剣な目で見つめられると、なんだか緊張して口が滑りそうになるな。」" },
        { speaker: "ハルト", text: "「単刀直入に言うよ。ねぇ……君は僕のこと、どう思ってる？」" }
      ],
      choices: [
        { text: "「気になる存在かな」と優しく微笑む", next: "like" },
        { text: "「ただの珍獣だと思ってる」と答える", next: "surreal" },
        { text: "「実は私もハルトのことが……」と見つめる", next: "love" }
      ]
    },
    like: {
      lines: [
        { speaker: "ハルト", text: "「気になる存在……か。」" },
        { speaker: "ハルト", text: "「ふふ、それって期待してもいいのかな？」" },
        { speaker: "ハルト", text: "「これからもっと僕のことを知ってほしいな。」" }
      ],
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    },
    surreal: {
      lines: [
        { speaker: "ハルト", text: "「ち、珍獣……！？」" },
        { speaker: "ハルト", text: "「僕、そんなに珍しい生態してるかな……？」" },
        { speaker: "ハルト", text: "「まあでも、特別視されてるなら……良しとするよ。」" }
      ],
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    },
    love: {
      lines: [
        { speaker: "ハルト", text: "「え……本当……！？」" },
        { speaker: "ハルト", text: "「夢じゃないよね。……よかった、勇気を出して聞いて。」" },
        { speaker: "ハルト", text: "「これからはもっと近くにいてもいいよね？」" }
      ],
      choices: [
        { text: "最初に戻る", next: "start" }
      ]
    }
  };

  let currentSceneKey = "start";
  let currentLineIndex = 0;

  const speakerEl = document.getElementById("speaker");
  const storyTextEl = document.getElementById("story-text");
  const choicesContainer = document.getElementById("choices");
  const arrowEl = document.getElementById("arrow");
  const windowEl = document.getElementById("message-window");

  // 画面描画の更新
  function render() {
    const scene = scenario[currentSceneKey];
    const currentLine = scene.lines[currentLineIndex];

    speakerEl.innerText = currentLine.speaker;
    storyTextEl.innerText = currentLine.text;

    const isLastLine = currentLineIndex === scene.lines.length - 1;

    // セリフが最後かつ選択肢がある場合
    if (isLastLine && scene.choices && scene.choices.length > 0) {
      arrowEl.style.display = "none";
      choicesContainer.style.display = "flex";
      choicesContainer.innerHTML = "";

      scene.choices.forEach(choice => {
        const button = document.createElement("button");
        button.className = "choice-btn";
        button.innerText = choice.text;
        
        // 選択肢ボタンのタップイベント（枠全体のタップとバブリング防止）
        button.onclick = (e) => {
          e.stopPropagation();
          currentSceneKey = choice.next;
          currentLineIndex = 0;
          render();
        };
        choicesContainer.appendChild(button);
      });
    } else {
      // まだセリフが続く場合
      arrowEl.style.display = "block";
      choicesContainer.style.display = "none";
    }
  }

  // セリフ枠全体をタップした時の挙動
  windowEl.onclick = () => {
    const scene = scenario[currentSceneKey];
    const isLastLine = currentLineIndex === scene.lines.length - 1;

    // まだ続きのセリフがあるなら次のセリフへ進む
    if (!isLastLine) {
      currentLineIndex++;
      render();
    }
  };

  // ゲーム開始
  render();
</script>

</body>
</html>
